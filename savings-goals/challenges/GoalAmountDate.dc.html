<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<style id="hide-ds-preview-toggle">/* hide the design-system floating light/dark PREVIEW toggle (not part of the app; re-injected on every export) */button[aria-label="Toggle light or dark mode"]{display:none!important;}</style>
<script id="app-vh-fix">/* stable mobile viewport height (matches the p1/p2 journey) so the frame does not resize as the iOS URL bar hides/shows during scroll */(function(){var s=function(){var h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;document.documentElement.style.setProperty('--app-vh',h+'px');};s();window.addEventListener('resize',s);window.addEventListener('orientationchange',s);if(window.visualViewport)window.visualViewport.addEventListener("resize",s);})();</script><style id="scroll-fix">/* horizontal carousels only pan sideways, so vertical drags pass straight to the page scroller */.gh-scroll{touch-action:pan-x;}</style>
</head>
<body>
<x-dc>

<helmet>
  <script src="./ds-base.js"></script>
  <style>
    .cnc-l-container { box-sizing: border-box; display: flex; flex-direction: column; padding-left: var(--spacing-size16); padding-right: var(--spacing-size16); margin-bottom: var(--spacing-size32); gap: var(--spacing-size12); }
    .cnc-l-container:last-child { margin-bottom: 0; }
    html, body { height: 100%; }
    html, body { overflow: hidden; }
    html body { margin: 0; background: var(--background-panel-pressed); display: flex; align-items: stretch; justify-content: center; }
    .gad-frame .cnc-tpl-base__container { scrollbar-width: none; -ms-overflow-style: none; }
    .gad-frame .cnc-tpl-base__container::-webkit-scrollbar { width: 0; height: 0; }
    .gad-frame .cnc-bottomnav { border-top: 1px solid var(--border-generic-default); }
    .gad-frame .cnc-cp { padding-left: 0 !important; padding-right: 0 !important; }
    .gad-frame .cnc-panel-wrap { padding-left: 0 !important; padding-right: 0 !important; }

    .gad-field { box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; min-height: var(--c-input-minheight); padding: var(--spacing-size16); border-radius: var(--c-input-cornerradius); border: 1px solid var(--border-input-default); background: var(--background-input-default); cursor: pointer; }
    .gad-field--active { border-color: var(--border-input-active); }
    .gad-field__text { color: var(--text-input-default); font-size: 20px; font-weight: 600; }

    .gad-chip-row { display: flex; flex-direction: row; gap: var(--spacing-size08); }
    .gad-chip-row .cnc-cbtn { flex: 1 1 0; min-width: 0; }

    .gad-save-row { box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--radius-medium); background: var(--background-panel-default); overflow: hidden; }
    .gad-save-card { box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--spacing-size04); padding: var(--spacing-size16); }
    .gad-save-card + .gad-save-card { border-left: 1px solid var(--border-generic-default); }
    .gad-save-amount { color: var(--text-generic-default); font-size: 22px; font-weight: 700; }
    .gad-save-label { color: var(--text-generic-subdued); }

    .gad-actionbar { position: absolute; left: 0; right: 0; bottom: var(--gad-nav-h, 0px); z-index: 2; background: var(--background-page-default); box-sizing: border-box; padding: var(--spacing-size16); margin-bottom: 0 !important; }
    .gad-frame .cnc-tpl-base__container { padding-bottom: calc(var(--gad-bar-h, 80px) + var(--spacing-size16)); }

    .gad-kb-scrim { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .gad-kb-scrim.gad-kb--open { opacity: 1; pointer-events: auto; }
    .gad-keypad { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--spacing-size08); padding: var(--spacing-size16); background: var(--background-panel-default); border-top: 1px solid var(--border-generic-default); transform: translateY(100%); transition: transform .25s ease; }
    .gad-keypad.gad-kb--open { transform: translateY(0); }
    .gad-key { min-height: 52px; border: 0; border-radius: var(--radius-small); background: var(--background-page-default); color: var(--text-generic-default); font-size: 20px; cursor: pointer; }
    .gad-key--return { background: var(--background-action-default); color: var(--text-action-inverse); font-weight: 600; grid-column: span 3; }
    .gad-loader-scrim { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: var(--background-overlay-default); opacity: 0; pointer-events: none; transition: opacity .25s ease; padding: 0 var(--spacing-size16); box-sizing: border-box; }
    .gad-loader-scrim .cnc-pmp { width: 100%; }
    .gad-loader-scrim.gad-loader--open { opacity: 1; pointer-events: auto; }
  </style>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("cnc-theme") || "dark");</script>
  <style>
    a { color: var(--text-action-default); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</helmet>

<div class="gad-frame" style="position: relative; box-sizing: border-box; width: 430px; max-width: 100vw; height: var(--app-vh, 100dvh); overflow: hidden; background: var(--background-page-default);">

  <x-import component-from-global-scope="CancaraDesignSystem_4b0109.BaseTemplate"
            title="Add a goal"
            leading-icon="{{ hasLeading }}"
            leading-icon-name="Arrows/Arrow Left/Arrow Left"
            on-leading="{{ onBack }}"
            trailing="{{ headerTrailing }}"
            on-trailing="{{ toggleTheme }}"
            status-bar="{{ noStatusBar }}"
            active="{{ noActiveTab }}"
            tabs="{{ noTabs }}"
            on-tab-change="{{ onTabChange }}"
            base-path="../_ds/cancara-design-system-4b01094f-a8cd-485e-9231-565a2863f34f"
            width="{{ frameW }}" height="100%" hint-size="430px,100%">

    <div data-screen-label="Set a goal - Add amount and date">

      <section class="cnc-l-container" style="margin-top: var(--spacing-size12);">
        <h2 class="type-style3" style="margin: 0; color: var(--text-generic-default);">Set your target amount</h2>
        <p class="type-style6" style="margin: 0; color: var(--text-generic-subdued);">Think about including your travel, accommodation, food and leisure expenses.</p>
        <div class="gad-field {{ amountFieldActiveClass }}" onClick="{{ openKeypad }}">
          <span class="gad-field__text">{{ amountDisplay }}</span>
        </div>
      </section>

      <section class="cnc-l-container" style="margin-top: var(--spacing-size12);">
        <h2 class="type-style3" style="margin: 0; color: var(--text-generic-default);">Set your target date</h2>
        <p class="type-style6" style="margin: 0; color: var(--text-generic-subdued);">Goals are set to the 1st of the month you choose.</p>

        <div class="gad-chip-row">
          <sc-for list="{{ yearOptions }}" as="opt" hint-placeholder-count="3">
            <x-import component-from-global-scope="CancaraDesignSystem_4b0109.CompactButton"
                      variant="{{ opt.variant }}"
                      on-click="{{ opt.onSelect }}"
                      base-path="../_ds/cancara-design-system-4b01094f-a8cd-485e-9231-565a2863f34f"
                      hint-size="100%,44px">{{ opt.label }}</x-import>
          </sc-for>
        </div>

        <x-import component-from-global-scope="CancaraDesignSystem_4b0109.CalendarPicker"
                  layout="default"
                  label="{{ noDateLabel }}"
                  value="{{ targetDateDisplay }}"
                  base-path="../_ds/cancara-design-system-4b01094f-a8cd-485e-9231-565a2863f34f"
                  width="100%"
                  hint-size="100%,56px"></x-import>
      </section>

      <sc-if value="{{ isFilled }}" hint-placeholder-val="{{ false }}">
      <section class="cnc-l-container" style="margin-top: var(--spacing-size12);">
        <h2 class="type-style3" style="margin: 0; color: var(--text-generic-default);">You'll need to save</h2>
        <div class="gad-save-row">
          <div class="gad-save-card">
            <span class="gad-save-amount">{{ perWeek }}</span>
            <span class="type-style8 gad-save-label">a week</span>
          </div>
          <div class="gad-save-card">
            <span class="gad-save-amount">{{ perMonth }}</span>
            <span class="type-style8 gad-save-label">a month</span>
          </div>
        </div>
      </section>

      <section class="cnc-l-container">
        <x-import component-from-global-scope="CancaraDesignSystem_4b0109.Panel"
                  asset="pictogram"
                  pictogram-icon="Finance/Piggy Bank/Piggy Bank"
                  pictogram-style="default"
                  heading="Make it work for you"
                  description="Find out if a mix of savings and borrowing could help you reach your goal faster."
                  base-path="../_ds/cancara-design-system-4b01094f-a8cd-485e-9231-565a2863f34f"
                  width="100%"
                  hint-size="100%,88px"></x-import>
      </section>
      </sc-if>

      <section class="cnc-l-container gad-actionbar">
        <x-import component-from-global-scope="CancaraDesignSystem_4b0109.ActionButton"
                  variant="primary"
                  on-click="{{ onContinue }}"
                  base-path="../_ds/cancara-design-system-4b01094f-a8cd-485e-9231-565a2863f34f"
                  hint-size="100%,48px">Continue</x-import>
      </section>

    </div>
  </x-import>

  <div class="gad-kb-scrim {{ kbOpenClass }}" onClick="{{ closeKeypad }}"></div>
  <div class="gad-keypad {{ kbOpenClass }}">
    <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
      <button class="gad-key {{ k.cls }}" onClick="{{ k.onPress }}">{{ k.label }}</button>
    </sc-for>
  </div>

  <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
  <div class="gad-loader-scrim {{ loaderOpenClass }}">
    <x-import component-from-global-scope="CancaraDesignSystem_4b0109.PopupModalPresets"
              preset="loader"
              title="Getting your goal ready"
              base-path="../_ds/cancara-design-system-4b01094f-a8cd-485e-9231-565a2863f34f"
              width="100%"
              hint-size="343px,180px"></x-import>
  </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { amountStr: "", years: null, kbOpen: false, loading: false };

  componentDidMount() {
    const tick = () => {
      const frame = document.querySelector(".gad-frame");
      const nav = frame && frame.querySelector(".cnc-bottomnav");
      const bar = frame && frame.querySelector(".gad-actionbar");
      if (!frame || !nav || !bar) { this._raf = requestAnimationFrame(tick); return; }
      const apply = () => {
        frame.style.setProperty("--gad-nav-h", nav.offsetHeight + "px");
        frame.style.setProperty("--gad-bar-h", bar.offsetHeight + "px");
      };
      apply();
      this._ro = new ResizeObserver(apply);
      this._ro.observe(nav);
      this._ro.observe(bar);
    };
    tick();
  }

  componentWillUnmount() {
    if (this._ro) this._ro.disconnect();
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  fmtGBP(n) {
    return "£" + Math.round(n).toLocaleString("en-GB");
  }

  targetDate(years) {
    const d = new Date();
    d.setMonth(d.getMonth() + years * 12);
    return d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
  }

  renderVals() {
    const { amountStr, years, kbOpen } = this.state;
    const amount = parseInt(amountStr || "0", 10);
    const isFilled = amountStr.length > 0 && years !== null;
    const weeks = (years || 1) * 52;
    const months = (years || 1) * 12;
    const perWeek = amount / weeks;
    const perMonth = amount / months;

    const digit = (d) => this.setState((s) => {
      const next = s.amountStr + String(d);
      return next.length > 7 ? s : { amountStr: next };
    });
    const backspace = () => this.setState((s) => ({ amountStr: s.amountStr.slice(0, -1) }));

    const keyRows = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"];
    const keys = keyRows.map((label) => {
      if (label === "⌫") return { label, cls: "", onPress: backspace };
      if (label === "") return { label: "", cls: "", onPress: () => {} };
      return { label, cls: "", onPress: () => digit(label) };
    });
    keys.push({ label: "Done", cls: "gad-key--return", onPress: () => this.setState({ kbOpen: false }) });

    return {
      toggleTheme: () => {
        const el = document.documentElement;
        const next = el.getAttribute("data-theme") === "dark" ? "light" : "dark";
        el.setAttribute("data-theme", next);
        try { localStorage.setItem("cnc-theme", next); } catch (e) {}
      },
      hasLeading: true,
      onBack: () => { window.location.href = "./ChooseGoal.dc.html"; },
      headerTrailing: ["Weather/Sun/Sun"],
      noStatusBar: null,
      noActiveTab: -1,
      noTabs: null,
      onTabChange: (i) => { if (i === 0) window.location.href = "../account-summary/AccountSummary.dc.html"; },
      frameW: "100%",
      noDateLabel: null,

      amountDisplay: amountStr ? this.fmtGBP(amount) : "£",
      amountFieldActiveClass: kbOpen ? "gad-field--active" : "",
      openKeypad: () => this.setState((s) => ({ kbOpen: true, amountStr: s.amountStr || "10000" })),
      closeKeypad: () => this.setState({ kbOpen: false }),
      kbOpenClass: kbOpen ? "gad-kb--open" : "",
      keys,

      yearOptions: [3, 5, 10].map((y) => ({
        label: `${y} years`,
        variant: y === years ? "primary" : "secondary",
        onSelect: () => this.setState({ years: y }),
      })),

      targetDateDisplay: years ? this.targetDate(years) : "",
      perWeek: this.fmtGBP(perWeek),
      perMonth: this.fmtGBP(perMonth),
      isFilled,

      loading: this.state.loading,
      loaderOpenClass: this.state.loading ? "gad-loader--open" : "",
      onContinue: () => {
        this.setState({ loading: true });
        setTimeout(() => { window.location.href = "./GoalOverview.dc.html"; }, 1200);
      },
    };
  }
}

</script>
</body>
</html>
