<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<!-- @template name="Service Capture Success" description="Centered success screen after setting the service reminder. Done writes completedTasks+lastCompletedTask into cnc-mobility-state and returns to hub." -->
<helmet>
  <script src="./ds-base.js"></script>
  <style>
    html, body { height: 100%; }
    html body { margin: 0; background: var(--background-panel-pressed); display: flex; align-items: stretch; justify-content: center; }
    .scs-frame .cnc-tpl-base__container { scrollbar-width: none; -ms-overflow-style: none; padding-top: var(--spacing-size08); }
    .scs-frame .cnc-tpl-base__container::-webkit-scrollbar { width: 0; height: 0; }
    .scs-actionbar {
      position: absolute; left: 0; right: 0;
      bottom: var(--scs-nav-h, 0px);
      z-index: 6;
      box-sizing: border-box;
      padding: var(--spacing-size16);
      background: var(--background-page-default);
    }
    .scs-frame .cnc-tpl-base__container {
      padding-bottom: calc(
        var(--scs-bar-h, 0px) +
        var(--spacing-size48) + var(--spacing-size16) + var(--spacing-size08) + var(--spacing-size04)
      );
    }
    .scs-center {
      min-height: calc(100dvh - 320px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: var(--spacing-size16);
    }
  </style>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("cnc-theme") || "dark");</script>
</helmet>

<div class="scs-frame" style="position: relative; box-sizing: border-box; width: 430px; max-width: 100vw; height: 100dvh; overflow: hidden; background: var(--background-page-default);">

  <x-import component-from-global-scope="CancaraDesignSystem_4b0109.BaseTemplate"
            title="Service reminder added"
            leading-icon="{{ hasLeading }}"
            leading-icon-name="Arrows/Arrow Left/Arrow Left"
            on-leading="{{ goBack }}"
            trailing="{{ headerTrailing }}"
            on-trailing="{{ toggleTheme }}"
            active="{{ homeTab }}"
            base-path="_ds/cancara"
            width="{{ frameW }}" height="100%" hint-size="430px,100%">

    <div data-screen-label="Service capture success">
      <section class="cnc-l-container" style="margin-bottom: var(--spacing-size08);">
        <div class="cnc-l-flush">
          <x-import component-from-global-scope="CancaraDesignSystem_4b0109.TwoTabsFixed" tab1-label="Overview" tab2-label="Your cars" value="{{ navTabValue }}" on-change="{{ onNavTabChange }}" width="100%" base-path="_ds/cancara" hint-size="100%,48px"></x-import>
        </div>
      </section>

      <section class="cnc-l-container">
        <div class="scs-center">
          <x-import component-from-global-scope="CancaraDesignSystem_4b0109.SpotIllustration" illustration="Default Alt 01/Tick/Tick" size="128" base-path="_ds/cancara" title="Success" hint-size="128px,128px"></x-import>
          <h1 class="type-style3" style="margin: 0; color: var(--text-generic-default);">You've added your service reminder.</h1>
          <p class="type-style6" style="margin: 0; max-width: 340px; color: var(--text-generic-default);">We'll be in touch 30 days before the due date.<br>You can change the details whenever you like.</p>
        </div>
      </section>
    </div>
  </x-import>

  <div class="scs-actionbar">
    <x-import component-from-global-scope="CancaraDesignSystem_4b0109.ActionButton" variant="primary" icon="Arrows/Arrow Right/Arrow Right" on-click="{{ onDone }}" base-path="_ds/cancara" width="100%" hint-size="100%,48px">Done</x-import>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const STATE_KEY = "cnc-mobility-state";
const DEFAULT_STATE = { isConnected: true, completedTasks: [], hasSeenInitialAnimation: false, lastCompletedTask: null };

function readState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (raw && typeof raw === "object") return Object.assign({}, DEFAULT_STATE, raw, { completedTasks: Array.isArray(raw.completedTasks) ? raw.completedTasks : [] });
  } catch (e) {}
  return Object.assign({}, DEFAULT_STATE);
}
function writeState(s) { try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {} }

class Component extends DCLogic {
  componentDidMount() {
    const tick = () => {
      const frame = document.querySelector(".scs-frame");
      const nav = frame && frame.querySelector(".cnc-bottomnav");
      const bar = frame && frame.querySelector(".scs-actionbar");
      if (!frame || !nav || !bar) { this._raf = requestAnimationFrame(tick); return; }
      const apply = () => {
        frame.style.setProperty("--scs-nav-h", nav.offsetHeight + "px");
        frame.style.setProperty("--scs-bar-h", bar.offsetHeight + "px");
      };
      apply();
      this._ro = new ResizeObserver(apply);
      this._ro.observe(nav);
      this._ro.observe(bar);
    };
    tick();
  }
  componentWillUnmount() {
    if (this._ro) this._ro.disconnect();
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  renderVals() {
    return {
      navTabValue: 1,
      onNavTabChange: (i) => { window.location.href = i === 0 ? "overview.dc.html" : "your-car-triple.dc.html"; },
      toggleTheme: () => {
        const el = document.documentElement;
        const next = el.getAttribute("data-theme") === "dark" ? "light" : "dark";
        el.setAttribute("data-theme", next);
        try { localStorage.setItem("cnc-theme", next); } catch (e) {}
      },
      headerTrailing: ["Weather/Sun/Sun"],
      hasLeading: true,
      goBack: () => { window.location.href = "cadillac-service-capture.dc.html"; },
      homeTab: null,
      frameW: 430,

      onDone: () => {
        const mob = readState();
        if (mob.completedTasks.indexOf("servicing") === -1) mob.completedTasks.push("servicing");
        mob.lastCompletedTask = "servicing";
        writeState(mob);
        window.location.href = "your-car-triple.dc.html";
      },
    };
  }
}

</script>
</body>
</html>
